name: E2E android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Without this the runner cannot open /dev/kvm, and an emulator without
      # hardware acceleration is too slow to be usable.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The Gradle config compiles against 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache pub
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install tooling
        run: |
          dart pub global activate melos 7.3.0
          dart pub global activate patrol_cli 4.4.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - run: melos bs

      # api-level 31 is Android 12, the same as the physical device the suite
      # was verified on. `run_android.sh` needs no argument: it takes the first
      # authorised device, and the emulator is the only one here.
      # Limpia lo de la corrida anterior, corre, y genera el reporte — las tres
      # cosas, igual que en web. El reporte se construye también cuando la
      # suite falla, y el paso sigue saliendo en rojo porque el script propaga
      # el código de salida de la suite.
      - name: Run the suite on an emulator and build the report
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          # Without a profile the AVD comes up at roughly 320x640 logical
          # pixels, and the dashboard's catalog button falls below the fold —
          # far enough down that Flutter never builds it, so the finder reports
          # "Found 0 widgets" rather than something invisible. pixel_5 is
          # 1080x2340, near the Samsung SM-A315G the suite was verified on.
          profile: pixel_5
          disable-animations: true
          script: bash tool/e2e/run_android.sh

      # Same guard as the web job: a green run whose assertions never reached
      # the report verifies nothing, and says so nowhere. On mobile the
      # markers travel through logcat instead of the browser console, so this
      # is the check that the device-log path carries them too.
      - name: Summarize the assertions
        if: always()
        # `shell: bash` and not the default: it is what sets `pipefail`, and
        # without it `tee` would return its own success and swallow the
        # script's exit code — quietly turning the check back into a notice.
        shell: bash
        run: node tool/allure/summarize_assertions.mjs --platform android | tee -a "$GITHUB_STEP_SUMMARY"

      # The device log is the only place the step and screenshot markers exist
      # on mobile, so it is worth keeping when a run goes wrong.
      - name: Upload the device log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-logcat
          path: build/e2e/android/android_run.log
          retention-days: 7

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-android
          path: build/e2e/android/allure/report
          retention-days: 14
