name: Publish reports

# The two suites are independent workflows, but a Pages deployment replaces
# the whole site and there is only one site per repository — so neither can
# publish on its own without erasing the other. This runs after either of them
# finishes, collects the latest report of *both* platforms, and deploys once.
on:
  workflow_run:
    workflows: ["E2E web", "E2E android"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Needed to list and download artefacts belonging to the other workflow.
  actions: read
  pages: write
  id-token: write

# Both suites finishing near each other would otherwise deploy at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Assemble and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The report of the platform that just ran is fetched the same way as the
      # other one — from the latest completed run — so there is a single code
      # path and no dependence on which workflow triggered this.
      #
      # A failed run still counts: its report is the one worth reading.
      - name: Collect the latest report of each platform
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p site

          collect () {
            workflow="$1"; artefact="$2"; target="$3"
            run=$(gh run list --workflow "$workflow" --branch main --limit 20 \
                    --json databaseId,status \
                    -q '[.[] | select(.status == "completed")][0].databaseId')
            if [ -z "$run" ]; then
              echo "· $workflow: no completed run yet"
              return
            fi
            if gh run download "$run" --name "$artefact" --dir "site/$target" 2>/dev/null; then
              echo "· $workflow: took $artefact from run $run"
            else
              echo "· $workflow: run $run has no $artefact"
            fi
          }

          collect "E2E web"     report-web     web
          collect "E2E android" report-android android

          if [ ! -d site/web ] && [ ! -d site/android ]; then
            echo "Neither platform has a report to publish."
            exit 1
          fi

      - name: Write the landing page
        run: |
          have () { [ -d "site/$1" ] && echo "$2" || echo "<span class=\"card muted\"><b>$3</b><span>no report yet</span></span>"; }
          cat > site/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Market · E2E reports</title>
          <style>
            :root { color-scheme: light dark; --fg:#111; --muted:#666; --line:#e5e7eb; --bg:#fff; --card:#fafafa; --accent:#0f766e; }
            @media (prefers-color-scheme: dark) {
              :root { --fg:#e8e8e8; --muted:#9a9a9a; --line:#2a2a2a; --bg:#111; --card:#181818; --accent:#5eead4; }
            }
            body { margin:0; padding:3rem 1.25rem; background:var(--bg); color:var(--fg);
                   font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
            main { max-width:44rem; margin:0 auto; }
            h1 { font-size:1.5rem; margin:0 0 .25rem; }
            p.sub { color:var(--muted); margin:0 0 2rem; }
            .card { display:block; padding:1.25rem 1.5rem; margin-bottom:1rem; text-decoration:none;
                    border:1px solid var(--line); border-radius:12px; background:var(--card); color:inherit; }
            a.card:hover { border-color:var(--accent); }
            .card b { display:block; font-size:1.1rem; }
            .card span { color:var(--muted); font-size:.9rem; }
            .muted { opacity:.55; }
            footer { margin-top:2.5rem; color:var(--muted); font-size:.85rem; }
            code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
            a { color:var(--accent); }
          </style>
          <main>
            <h1>Market · end-to-end reports</h1>
            <p class="sub">Patrol suite, one report per platform. Each is rebuilt from scratch on every run.</p>
            $(have web '<a class="card" href="web/"><b>Web</b><span>Chromium, driven by Playwright</span></a>' 'Web')
            $(have android '<a class="card" href="android/"><b>Android</b><span>emulator, API 31, native instrumentation</span></a>' 'Android')
            <footer>
              Published by run
              <a href="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}">#${GITHUB_RUN_NUMBER}</a>
              from <code>${GITHUB_SHA:0:7}</code>
            </footer>
          </main>
          HTML
          find site -maxdepth 2 -name index.html | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
