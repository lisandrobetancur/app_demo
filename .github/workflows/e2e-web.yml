name: E2E web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Turning the JUnit results into annotations writes a check run.
  checks: write

jobs:
  web:
    name: Web suite
    runs-on: ubuntu-latest
    # A backstop, not a budget. The job takes seven minutes; a red run with
    # every test waiting out its own timeout took forty-four, and that one is
    # still worth finishing, because its report is the point. What this stops
    # is the third case: a step that hangs and never returns. GitHub's default
    # would let it sit for six hours, and one did — three hours and forty-eight
    # minutes inside `npx playwright install`, on a step that takes forty
    # seconds, with nothing to show for any of it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      # Patrol drives the web suite through Playwright, so the runner needs
      # Node: `patrol test` shells out to `npm install` and
      # `npx playwright install` inside the patrol package.
      - uses: actions/setup-node@v7
        with:
          node-version-file: packages/e2e_framework/tool/e2e/.nvmrc

      # Chromium is a ~130 MB download on every cold run. The pub cache holds
      # the activated CLIs and the web runner's node_modules, which live inside
      # the patrol package rather than in the repo.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install tooling
        run: |
          dart pub global activate melos 7.3.0
          dart pub global activate patrol_cli 4.7.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - run: melos bs

      # `patrol test` runs `npx playwright install` itself, but without
      # `--with-deps` — and a Chromium missing its system libraries dies before
      # the first test with its stderr swallowed by the CLI, which surfaces
      # only as "Playwright process exited unexpectedly with code 1". Doing the
      # install here makes both the dependencies and any error visible; the
      # install Patrol runs later then finds everything in place.
      #
      # Ten minutes for a step that takes forty seconds: `--with-deps` shells
      # out to `apt-get`, and an apt mirror that stops answering hangs rather
      # than fails. Failing here is worth far more than waiting — the run is
      # already lost, and a job that ends in ten minutes gets re-run, while one
      # that sits for hours only gets noticed.
      - name: Install Playwright and its system dependencies
        timeout-minutes: 10
        run: |
          RUNNER_DIR="$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name 'patrol-*' | head -1)/web_runner"
          cd "$RUNNER_DIR"
          npm install
          npx playwright install --with-deps chromium

      - name: Analyze
        run: melos run lint

      # Before spending two minutes of browser time: if the framework itself
      # is broken, the E2E suite would lie rather than fail.
      - name: Test the kit
        run: melos run testKit

      # And the wiring: that the data JSON is declared as assets, that the
      # index points at files that exist, and that the fields are named the way
      # the façade believes. Break this and the E2E suite fails for what looks
      # like a product defect.
      - name: Test the data files
        run: melos run testApp

      # Cleans up after the previous run, runs, and builds the report — all
      # three. The report is built even when the suite fails, which is when it
      # matters, and the step still exits red because the script propagates the
      # suite's exit code rather than the report's.
      - name: Run the suite and build the report
        run: melos run e2eWeb

      # A green suite is not the same as a suite that verified something. The
      # assertions travel from the browser console through Playwright's
      # per-test capture into the report, and a break anywhere along there is
      # silent: the tests still pass, the report just holds nothing. The count
      # goes in the job summary so that is visible from the PR, without
      # downloading the artifact.
      - name: Summarize the assertions
        if: always()
        # `shell: bash` and not the default: it is what sets `pipefail`, and
        # without it `tee` would return its own success and swallow the
        # script's exit code — quietly turning the check back into a notice.
        shell: bash
        run: dart run sqa_reporter:assertion_summary --platform web | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish the JUnit results as a check
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: build/e2e/web/playwright/results.xml
          check_name: JUnit — web
          fail_on_failure: false

      # `melos run e2eWeb` built the report in the step above; this only
      # collects it. One directory holds the whole thing — the pages, the
      # results they read and the screenshots — so the artifact is a report
      # that opens from `index.html` with nothing else to fetch.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-web
          path: build/e2e/web/sqa_reporter/report
          retention-days: 14

      # What the browser left behind when it went wrong: a Playwright trace and
      # a screenshot per failing test, written by `run_web.sh`'s
      # `retain-on-failure`. Produced and never collected they would be worth
      # nothing, and this is the artefact that answers the question a hung run
      # raises — whether the app painted anything at all. Seven days, not
      # fourteen: a trace is large, and nobody opens one a week later.
      - name: Upload the browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: build/e2e/web/test-results
          retention-days: 7
          if-no-files-found: ignore

      # At the end of the job, and not next to the failure: this step runs the
      # suite again, which overwrites build/e2e/web/playwright/ — the results
      # the report and the JUnit check are built from. Placed earlier, a red
      # run ended up publishing a report of the RE-run instead of the original
      # one. By here everything is already published and it can overwrite
      # whatever it likes.
      #
      # The CLI hides Playwright's stderr, so a failure that is not a failing
      # test — a browser that will not start, a config that will not load —
      # arrives as a bare exit code. This repeats it in verbose to get the
      # reason out of it.
      #
      # Through the same script the suite ran, and not a `patrol test` typed
      # out here. A diagnosis is only worth reading if it reproduces the run
      # that failed, and this step used to drop `--web-locale=es-ES`: the app
      # then died at boot with "Incorrect locale information provided", and the
      # job reported that as the cause of a failure that was four tests timing
      # out. A wrong reason costs more than no reason.
      #
      # Capped, because the shape of failure it exists to explain is a hang:
      # the run this was written for spent forty minutes waiting out four
      # ten-minute test timeouts, and the browser's own stderr — the thing
      # worth having — is written in the first seconds either way.
      - name: Diagnose a suite failure
        if: failure()
        run: |
          timeout 600 bash packages/e2e_framework/tool/e2e/run_web.sh --verbose \
            > /tmp/patrol.log 2>&1 || true
          echo "===== first lines the browser wrote (the message, not the stack) ====="
          grep -n "Playwright stderr" /tmp/patrol.log | head -40 | cut -c1-300 || true
          echo "===== anything that reads like a Dart failure ====="
          grep -nE "Unsupported|Unhandled|Unexpected|Failed assertion|MissingPlugin|NoSuchMethod|TypeError|Uncaught|Exception|Error:" /tmp/patrol.log \
            | grep -v "dart_sdk.js" | head -25 | cut -c1-300 || true
          echo "===== how each test ended ====="
          grep -nE "^\s*(✅|❌|⏩|🧪)|Timeout of|Test timeout|exited unexpectedly" /tmp/patrol.log \
            | head -40 | cut -c1-300 || true
