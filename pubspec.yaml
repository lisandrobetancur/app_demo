name: market_workspace
description: "Workspace root of the market monorepo: a local, offline-first vehicle marketplace demo."
publish_to: none

environment:
  sdk: ^3.11.5

workspace:
  - packages/apps/market_app
  - packages/development/lint
  - packages/sqa_l/patrol_kit
  - packages/sqa_l/sqa_reporter
  - packages/features/core/cart/constants
  - packages/features/core/cart/module
  - packages/features/core/cart/typing
  - packages/features/core/catalog/constants
  - packages/features/core/catalog/module
  - packages/features/core/catalog/typing
  - packages/features/core/orders/constants
  - packages/features/core/orders/module
  - packages/features/core/orders/typing
  - packages/features/generic/app_cross/constants
  - packages/features/generic/app_cross/module
  - packages/features/generic/app_cross/typing
  - packages/features/generic/authentication/constants
  - packages/features/generic/authentication/module
  - packages/features/generic/authentication/typing
  - packages/features/generic/dashboard/constants
  - packages/features/generic/dashboard/module
  - packages/features/generic/dashboard/typing
  - packages/features/generic/profile/constants
  - packages/features/generic/profile/module
  - packages/features/generic/profile/typing
  - packages/shared/database
  - packages/shared/navigator
  - packages/shared/typing
  - packages/shared/utilities
  - packages/ui/components/packages/empty_state
  - packages/ui/components/packages/filter_chip_bar
  - packages/ui/components/packages/price_tag
  - packages/ui/components/packages/product_card
  - packages/ui/components/packages/quantity_stepper
  - packages/ui/components/packages/rating_stars
  - packages/ui/components/packages/status_badge
  - packages/ui/components/packages/stepper_header
  - packages/ui/design_system

dev_dependencies:
  melos: 7.3.0
  yaml: 3.1.3

# Melos 7 reads its configuration from the workspace root pubspec.yaml
# (the standalone melos.yaml of earlier versions is no longer picked up).
melos:
  name: market

  command:
    bootstrap:
      enforceLockfile: false

  scripts:
    lint: flutter analyze --no-fatal-infos

    # The framework's own tests: headless, no browser and no device. They
    # cover what would break silently — the price parser, the seam between soft
    # assertions and the report, `should`'s grouping rule and the
    # failed/broken classification.
    testKit: melos exec --scope=patrol_kit -- flutter test

    # The app's unit tests. Today they are the ones checking that the data
    # files exist, are declared as assets and hold the fields the façade reads
    # — the wiring that, when broken, fails an E2E for what looks like a
    # product reason.
    testApp: melos exec --scope=market_app -- flutter test

    # Everything that runs without a browser or a device, in one command.
    testFast: melos run testKit && melos run testApp
    dartFormat: melos exec -c 1 -- dart format . --line-length 80
    dartFix: melos exec -c 1 -- dart fix --apply
    rmlock: melos exec -c 1 -- rm -f pubspec.lock
    rmOverrides: melos exec -c 1 -- rm -f pubspec_overrides.yaml
    pubGet: melos exec -c 1 -- flutter pub get

    # ── Suite end-to-end ────────────────────────────────────────────────
    #
    # Each of these commands does THREE things, in this order:
    #
    #   1. deletes what the previous run left FOR THAT PLATFORM,
    #   2. runs the suite,
    #   3. builds the report — always, including when the suite failed.
    #
    # The report is part of running, not a step somebody has to remember to
    # launch. Opening it stays separate (`sqaOpenWeb` / `sqaOpenAndroid`),
    # because building and opening are different decisions and in CI only the
    # first one exists.
    #
    # The exit code is the suite's, not the report's: a red run exits red even
    # when its report was built fine.
    #
    # Everything generated goes to ONE root per platform:
    #
    #   build/e2e/web/{playwright,sqa_reporter/report}
    #   build/e2e/android/{android_run.log,sqa_reporter/report}
    #
    # That is what makes the cleanup trustworthy: deleting the whole root
    # cannot leave anything behind, while enumerating four paths scattered
    # around the repo can — which is how `test-results/` went undeleted for
    # months.
    #
    # At the start and not at the end: cleaning up afterwards leaves the
    # machine tidy but takes the evidence of what just failed with it.
    e2eWeb: bash packages/sqa_l/tool/e2e/run_web.sh
    e2eAndroid: bash packages/sqa_l/tool/e2e/run_android.sh

    # With a visible browser, to watch it drive the app.
    e2eWebHeaded: bash packages/sqa_l/tool/e2e/run_web.sh --headed

    # Filtering by tag. Patrol takes boolean expressions, not just names, and
    # the filter is applied while GENERATING the bundle: an excluded test is
    # never compiled into the binary — not compiled and then skipped. The
    # vocabulary lives in `Tags`, in the kit.
    e2eWebSmoke: bash packages/sqa_l/tool/e2e/run_web.sh --tags=smoke_test
    e2eWebNegative: bash packages/sqa_l/tool/e2e/run_web.sh --tags=negative

    # On a browser installed here rather than the Chromium Playwright ships.
    # Useful for the differences a bundled build hides — codecs, fonts, the
    # printing path — but both are Chromium: Patrol exposes no other engine, so
    # this is not cross-engine coverage and should not be mistaken for it.
    # Needs the browser present, which is why CI stays on the default.
    e2eWebChrome: bash packages/sqa_l/tool/e2e/run_web.sh --browser=chrome
    e2eWebEdge: bash packages/sqa_l/tool/e2e/run_web.sh --browser=msedge

    # Cleanup only, for when you want to zero a platform without running
    # anything.
    e2eClean: bash packages/sqa_l/tool/e2e/clean.sh web && bash packages/sqa_l/tool/e2e/clean.sh android
    e2eCleanWeb: bash packages/sqa_l/tool/e2e/clean.sh web
    e2eCleanAndroid: bash packages/sqa_l/tool/e2e/clean.sh android

    # Run and also OPEN the report. `e2eWeb` already builds it; this only adds
    # the opening on top.
    e2eWebReport: melos run e2eWeb && melos run sqaOpenWeb
    e2eWebHeadedReport: melos run e2eWebHeaded && melos run sqaOpenWeb

    # ── SQA Reporter ────────────────────────────────────────────────────
    #
    # The report, written in Dart and living in packages/sqa_l/sqa_reporter.
    # `e2eWeb` and `e2eAndroid` already build it as part of running, and these
    # are for rebuilding it from the results ALREADY on disk — when you change
    # the generator and want to see the effect without paying for another
    # suite run.
    #
    # One report per platform, kept apart on purpose: a web run and a device
    # run are different environments, and merging them would average away the
    # differences worth seeing. No history is kept either, by choice: a report
    # describes one execution and nothing else.
    #
    # One directory holds everything it produces: the JSON results, the
    # screenshots and the pages that read them. It writes that directory from
    # scratch every time, so a report only ever describes one run.
    #
    # There is no `serve` counterpart on purpose. The site is static and
    # self-contained — no libraries, no fonts, no requests — so a browser opens
    # it straight off the filesystem and a local server would only be one more
    # thing to remember to stop.
    sqaWeb: dart run sqa_reporter --input build/e2e/web/playwright/results.json --platform web
    sqaAndroid: dart run sqa_reporter --input build/e2e/android/android_run.log --format patrol-log --platform android
    sqaOpenWeb: bash packages/sqa_l/tool/e2e/open_report.sh build/e2e/web/sqa_reporter/report/index.html
    sqaOpenAndroid: bash packages/sqa_l/tool/e2e/open_report.sh build/e2e/android/sqa_reporter/report/index.html
