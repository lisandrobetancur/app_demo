name: market_workspace
description: "Workspace root of the market monorepo: a local, offline-first vehicle marketplace demo."
publish_to: none

environment:
  sdk: ^3.11.5

workspace:
  - packages/apps/market_app
  - packages/development/lint
  - packages/qa/patrol_kit
  - packages/features/core/cart/constants
  - packages/features/core/cart/module
  - packages/features/core/cart/typing
  - packages/features/core/catalog/constants
  - packages/features/core/catalog/module
  - packages/features/core/catalog/typing
  - packages/features/core/orders/constants
  - packages/features/core/orders/module
  - packages/features/core/orders/typing
  - packages/features/generic/app_cross/constants
  - packages/features/generic/app_cross/module
  - packages/features/generic/app_cross/typing
  - packages/features/generic/authentication/constants
  - packages/features/generic/authentication/module
  - packages/features/generic/authentication/typing
  - packages/features/generic/dashboard/constants
  - packages/features/generic/dashboard/module
  - packages/features/generic/dashboard/typing
  - packages/features/generic/profile/constants
  - packages/features/generic/profile/module
  - packages/features/generic/profile/typing
  - packages/shared/database
  - packages/shared/navigator
  - packages/shared/typing
  - packages/shared/utilities
  - packages/ui/components/packages/empty_state
  - packages/ui/components/packages/filter_chip_bar
  - packages/ui/components/packages/price_tag
  - packages/ui/components/packages/product_card
  - packages/ui/components/packages/quantity_stepper
  - packages/ui/components/packages/rating_stars
  - packages/ui/components/packages/status_badge
  - packages/ui/components/packages/stepper_header
  - packages/ui/design_system

dev_dependencies:
  melos: 7.3.0
  yaml: 3.1.3

# Melos 7 reads its configuration from the workspace root pubspec.yaml
# (the standalone melos.yaml of earlier versions is no longer picked up).
melos:
  name: market

  command:
    bootstrap:
      enforceLockfile: false

  scripts:
    lint: flutter analyze --no-fatal-infos

    # Los tests del propio framework: headless, sin navegador ni dispositivo.
    # Cubren lo que se rompería en silencio — el parser de precios, la costura
    # entre aserciones suaves y reporte, la regla de agrupación de `should` y
    # la clasificación failed/broken.
    testKit: melos exec --scope=patrol_kit -- flutter test

    # Los tests unitarios de la app. Hoy son los que comprueban que los
    # archivos de datos existen, se declaran como assets y contienen los
    # campos que la fachada lee — la parte del cableado que, si se rompe,
    # hace fallar un E2E por lo que parece una razón de producto.
    testApp: melos exec --scope=market_app -- flutter test

    # Todo lo que corre sin navegador ni dispositivo, en un solo comando.
    testFast: melos run testKit && melos run testApp
    dartFormat: melos exec -c 1 -- dart format . --line-length 80
    dartFix: melos exec -c 1 -- dart fix --apply
    rmlock: melos exec -c 1 -- rm -f pubspec.lock
    rmOverrides: melos exec -c 1 -- rm -f pubspec_overrides.yaml
    pubGet: melos exec -c 1 -- flutter pub get

    # ── Suite end-to-end ────────────────────────────────────────────────
    #
    # Cada uno de estos comandos hace TRES cosas, en este orden:
    #
    #   1. borra lo que dejó la corrida anterior DE ESA plataforma,
    #   2. corre la suite,
    #   3. genera el reporte de Allure — siempre, también si la suite falló.
    #
    # Es el modelo de `aggregate` de Serenity: el reporte es parte de la
    # ejecución, no un paso que alguien tiene que acordarse de lanzar. Abrirlo
    # sigue siendo aparte (`allureServeWeb` / `allureServeAndroid`), porque
    # generar y abrir son decisiones distintas y en CI sólo existe la primera.
    #
    # El código de salida es el de la suite, no el del reporte: una corrida
    # roja sale roja aunque su reporte se haya construido bien.
    #
    # Lo que se borra al empezar, por plataforma, está en tool/e2e/clean.sh.
    # Al empezar y no al terminar: limpiar al final deja la máquina limpia
    # pero se lleva la evidencia de lo que acaba de fallar.
    e2eWeb: bash tool/e2e/run_web.sh
    e2eAndroid: bash tool/e2e/run_android.sh

    # Con navegador visible, para verlo manejar la app.
    e2eWebHeaded: bash tool/e2e/run_web.sh --headed

    # Filtrado por tags. Patrol acepta expresiones booleanas, no sólo nombres,
    # y el filtro se aplica al GENERAR el bundle: un test excluido no se
    # compila dentro del binario, no es que se compile y se salte. El
    # vocabulario está en `Tags`, en el kit.
    e2eWebSmoke: bash tool/e2e/run_web.sh --tags=smoke_test
    e2eWebNegative: bash tool/e2e/run_web.sh --tags=negativo

    # Sólo la limpieza, para cuando quieras dejar una plataforma en cero sin
    # correr nada.
    e2eClean: bash tool/e2e/clean.sh web && bash tool/e2e/clean.sh android
    e2eCleanWeb: bash tool/e2e/clean.sh web
    e2eCleanAndroid: bash tool/e2e/clean.sh android

    # Correr y además ABRIR el reporte. La generación ya la hace `e2eWeb`;
    # esto sólo añade el servidor local encima.
    e2eWebReport: melos run e2eWeb && melos run allureServeWeb
    e2eWebHeadedReport: melos run e2eWebHeaded && melos run allureServeWeb

    # Everything Allure produces lives under one directory:
    #
    #   allure/
    #   ├── web/{results,report}
    #   └── android/{results,report}
    #
    # One report per platform, kept apart on purpose: a web run and a device
    # run are different environments, and merging them would average away the
    # differences worth seeing.
    #
    # Every run starts from nothing: the platform directory is deleted before
    # it is rebuilt, so a report only ever describes the run that produced it.
    # That is not just tidiness — Allure 3 has no `--clean`, and generating
    # into a directory that already holds a report nests the new one under
    # `awesome/` instead of replacing it, which silently leaves you reading a
    # stale report.
    #
    # No history is kept, by choice. Allure can accumulate one with
    # `--history-path` to draw Status dynamics and Durations dynamics, but
    # that file is state surviving between runs, and here a report is meant to
    # describe one execution and nothing else.
    # Regenerar el reporte a partir de los resultados que YA hay en disco,
    # sin volver a correr la suite. `e2eWeb` y `e2eAndroid` ya lo generan; esto
    # es para cuando cambias el convertidor y quieres ver el efecto.
    allureWeb: rm -rf allure/web && node tool/allure/patrol_to_allure.mjs --platform web && npx --prefix tool/allure allure awesome allure/web/results --output allure/web/report --report-name "Market E2E · Web"
    allureAndroid: rm -rf allure/android && node tool/allure/patrol_to_allure.mjs --input build/e2e/android_run.log --platform android && npx --prefix tool/allure allure awesome allure/android/results --output allure/android/report --report-name "Market E2E · Android"
    allureServeWeb: npx --prefix tool/allure allure serve allure/web/results
    allureServeAndroid: npx --prefix tool/allure allure serve allure/android/results
