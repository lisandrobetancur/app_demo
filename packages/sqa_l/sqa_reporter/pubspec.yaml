name: sqa_reporter
description: "Turns a Patrol run into SQA Reporter results: a run model that owes nothing to any output format, and a serialiser that writes Serenity-schema JSON from it. Pure Dart; carries nothing app-specific."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.5

resolution: workspace

# Deliberately tiny, and deliberately free of Flutter, the kit, Patrol and the
# app: this package reads a documented marker stream from files and writes
# files. The pubspec is what turns that rule into something the resolver
# enforces — an import from any of them does not compile.
dependencies:
  # sha256 for Serenity's report file names: sha256(completeName).json.
  crypto: 3.0.7

dev_dependencies:
  lint: 0.1.0
  # The one dependency in this repository deliberately NOT pinned, and the
  # reason is a chain of exact pins outside our control: `flutter_test` from
  # the SDK pins `test_api` to one version, and `test` pins `test_api` to one
  # version too (1.30.0 → 0.7.10, 1.31.0 → 0.7.11, …). Since the workspace
  # resolves as one, pinning `test` here would pin the Flutter SDK everybody
  # must have — which is not this package's business to decide. A range lets
  # the solver pick the `test` whose `test_api` matches whatever SDK is
  # installed; the API used here (test, group, expect, setUpAll) is the same
  # across all of them.
  test: ">=1.25.0 <2.0.0"
