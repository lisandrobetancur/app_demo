# El vocabulario de tags de la suite E2E.
#
# Declararlos aquí no es lo que hace que el filtrado funcione — eso lo hace
# Patrol, que aplica `--tags` al generar el bundle de pruebas. Esto es la otra
# mitad: `package:test` avisa cuando un test usa un tag que nadie declaró, y
# ese aviso es justamente lo que atrapa el `smoke` escrito donde iba
# `smoke_test`. Un filtro mal escrito no falla: selecciona menos pruebas de
# las que quien lo escribió cree.
#
# Las constantes viven en `Tags`, en patrol_kit. Esta lista debe reflejarlas.
tags:
  smoke_test:
    description: La suite corta; decide si la build merece más pruebas.
  regression:
    description: La suite completa.
  exito:
    description: Camino feliz — se le pide al producto que haga su trabajo.
  negativo:
    description: Camino negativo — la aserción es sobre el rechazo.
  lento:
    description: Suficientemente lento como para excluirlo de un ciclo rápido.
