# The tag vocabulary of the E2E suite.
#
# Declaring them here is not what makes filtering work — Patrol does that, by
# applying `--tags` while it generates the test bundle. This is the other half:
# `package:test` warns when a test uses a tag nobody declared, and that warning
# is exactly what catches a `smoke` written where `smoke_test` was meant. A
# misspelled filter does not fail: it selects fewer tests than whoever wrote it
# believes.
#
# The constants live in `Tags`, in patrol_kit. This list must mirror them.
tags:
  smoke_test:
    description: The short suite; decides whether the build is worth testing further.
  regression:
    description: The full suite.
  success:
    description: Happy path — the product is asked to do its job and does.
  negative:
    description: Negative path — the assertion is on the refusal.
  wip:
    description: >-
      Being refactored or repaired. e2eTest registers such a test as skipped,
      so it reaches the report under Skipped without its body running; melos
      run e2eWebWip is the way back in.
